<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D13" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0A0C11" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bg)" />
  <rect x="30" y="30" width="1140" height="790" fill="none" stroke="#262D3D" stroke-width="2" rx="12" />
  <rect x="45" y="45" width="1110" height="760" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="12 6" rx="8" opacity="0.6" />
  
  <!-- Header Institution -->
  <text x="600" y="115" font-family="'Outfit', 'Inter', sans-serif" font-size="18" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="4">
    NRI INSTITUTE OF TECHNOLOGY • CODING CLUB &amp; MTX PARTNERSHIP
  </text>
  
  <!-- Title -->
  <text x="600" y="185" font-family="'Outfit', 'Inter', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    CERTIFICATE OF PARTICIPATION
  </text>
  
  <text x="600" y="225" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#CBD5E1" text-anchor="middle" letter-spacing="3">
    THIS IS PROUDLY PRESENTED TO
  </text>
  
  <!-- Name -->
  <text x="600" y="320" font-family="'Outfit', 'Inter', sans-serif" font-size="52" font-weight="900" fill="url(#cyan)" text-anchor="middle" letter-spacing="1">
    S. Jagadeshwar Reddy
  </text>
  <line x1="320" y1="345" x2="880" y2="345" stroke="url(#cyan)" stroke-width="2" opacity="0.8" />
  
  <!-- Body text -->
  <text x="600" y="410" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#E2E8F0" text-anchor="middle">
    for actively participating in the flagship 24-Hour National Hackathon
  </text>
  <text x="600" y="460" font-family="'Outfit', 'Inter', sans-serif" font-size="36" font-weight="800" fill="url(#gold)" text-anchor="middle" letter-spacing="2">
    ASTRA HACKATHON 2026
  </text>
  <text x="600" y="510" font-family="'Inter', sans-serif" font-size="17" font-weight="400" fill="#94A3B8" text-anchor="middle">
    Demonstrating exceptional engineering capability, algorithmic problem solving, and rapid prototype delivery.
  </text>
  
  <!-- Details Box -->
  <rect x="220" y="565" width="760" height="90" rx="10" fill="#1E2433" stroke="#334155" stroke-width="1" />
  <text x="350" y="605" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">EVENT DATE</text>
  <text x="350" y="633" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle">September 21, 2026</text>
  
  <line x1="480" y1="580" x2="480" y2="640" stroke="#334155" stroke-width="1" />
  
  <text x="600" y="605" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">HOST INSTITUTION</text>
  <text x="600" y="633" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle">NRI Institute of Technology</text>
  
  <line x1="720" y1="580" x2="720" y2="640" stroke="#334155" stroke-width="1" />
  
  <text x="850" y="605" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">TECHNOLOGY PARTNER</text>
  <text x="850" y="633" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle">MTX Technology Partner</text>
  
  <!-- Signatures Footer -->
  <text x="320" y="745" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#CBD5E1" text-anchor="middle">Faculty Coordinator</text>
  <text x="320" y="768" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Coding Club NRIIT</text>
  
  <!-- Golden Seal -->
  <circle cx="600" cy="740" r="32" fill="#1E2433" stroke="url(#gold)" stroke-width="2" />
  <text x="600" y="746" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="url(#gold)" text-anchor="middle">ASTRA</text>
  
  <text x="880" y="745" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#CBD5E1" text-anchor="middle">Dr. Dola Sanjay</text>
  <text x="880" y="768" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Principal, NRIIT</text>
</svg>
